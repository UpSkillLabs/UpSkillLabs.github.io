<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div id="loading" class="loading-screen">
    <div class="spinner"></div>
    <span>Loading deck…</span>
</div>

<div class="app-shell">

    <header class="top-bar">
        <div class="top-meta">
            <h1 id="appTitle" style="display:none"></h1>
            <p id="appSubtitle" class="subtitle"></p>
        </div>
        <div class="stats-bar" id="statsBar" style="display:none">
        <span class="stat">
          <span class="stat-num green" id="statKnow">0</span>
          <span class="stat-lbl">Know</span>
        </span>
            <span class="stat-divider"></span>
            <span class="stat">
          <span class="stat-num red" id="statUnsure">0</span>
          <span class="stat-lbl">Unsure</span>
        </span>
            <span class="stat-divider"></span>
            <span class="stat">
          <span class="stat-num amber" id="statLeft">0</span>
          <span class="stat-lbl">Left</span>
        </span>
            <span class="stat-divider"></span>
            <span class="stat">
          <span class="stat-num muted" id="statTotal">0</span>
          <span class="stat-lbl">Total</span>
        </span>
        </div>
    </header>

    <div class="progress-track" id="progressWrap" style="display:none">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>

    <div class="mode-bar" id="modeBar" style="display:none">
        <button class="mode-btn active" onclick="setMode('all')" id="mode-all">
            All
        </button>
        <button class="mode-btn" onclick="setMode('unsure')" id="mode-unsure">
            Unsure
        </button>
        <button class="mode-btn" onclick="setMode('shuffle')" id="mode-shuffle">
            Shuffle
        </button>
    </div>

    <div class="filter-scroll" id="filterBar"></div>

    <div class="stage" id="cardContainer" style="display:none">
        <div class="swipe-hint swipe-left" id="swipeLeft">✕</div>
        <div class="swipe-hint swipe-right" id="swipeRight">✓</div>
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="face-tags">
                    <span class="tag tag-topic" id="topicTag"></span>
                    <span class="tag" id="typeTag"></span>
                </div>
                <div class="card-body">
                    <p class="question" id="questionText"></p>
                </div>
                <div class="face-foot">
                    <span class="tap-hint">tap to reveal</span>
                    <span class="card-num" id="cardNum"></span>
                </div>
            </div>
            <div class="card-face card-back">
                <div class="face-tags">
                    <span class="tag tag-topic" id="topicTagB"></span>
                </div>
                <div class="card-body">
                    <p class="answer" id="answerText"></p>
                </div>
                <div class="face-foot">
                    <span class="tap-hint">swipe or use buttons</span>
                </div>
            </div>
        </div>
    </div>

    <nav class="action-bar" id="controls1" style="display:none">
        <button class="action-btn btn-unsure" onclick="markCard(false)">
            <span class="action-icon">✕</span>
            <span class="action-lbl">Unsure</span>
        </button>
        <button class="action-btn btn-flip" onclick="flipCard()">
            <span class="action-icon">↺</span>
            <span class="action-lbl">Flip</span>
        </button>
        <button class="action-btn btn-know" onclick="markCard(true)">
            <span class="action-icon">✓</span>
            <span class="action-lbl">Know</span>
        </button>
    </nav>

    <div class="kb-hint" id="kbHint" style="display:none">
<!--        <kbd>Space</kbd> flip · <kbd>→</kbd> know · <kbd>←</kbd> unsure-->
    </div>

    <div class="restart-bar" id="controls2">
        <button class="ghost-btn" onclick="restart()">↺ Restart</button>
        <button class="ghost-btn" onclick="restartAll()">⟳ Reset All</button>
    </div>

    <div class="complete-screen" id="completeScreen">
        <div class="complete-card">
            <div class="complete-emoji">🎉</div>
            <h2 class="complete-title">Deck Complete</h2>
            <div class="score-ring">
                <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%"
                                        y2="0%">
                            <stop offset="0%" stop-color="#7c9fff"/>
                            <stop offset="100%" stop-color="#a78bfa"/>
                        </linearGradient>
                    </defs>
                    <circle cx="40" cy="40" r="34" class="ring-bg"/>
                    <circle cx="40" cy="40" r="34" class="ring-fill"
                            id="ringFill"/>
                </svg>
                <div class="score-inner">
                    <span class="score-pct" id="scorePct">0%</span>
                    <span class="score-sub">known</span>
                </div>
            </div>
            <p class="complete-sub" id="completeSub"></p>
            <div class="complete-actions">
                <button class="pill-btn pill-primary" onclick="restart()">Review
                    Again
                </button>
                <button class="pill-btn pill-secondary"
                        onclick="reviewUnsure()">Unsure Only
                </button>
            </div>
        </div>
    </div>

</div><!-- /app-shell -->

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
